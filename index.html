<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de casamiento</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <audio id="bg-music" loop autoplay>
        <source src="assets/unchained melody.mp3" type="audio/mpeg">
    </audio>

    <header id="hero" class="section">
        <div class="hero-content">
            <h1 id="couple-names" class="nombres"></h1>
            <p id="hero-date" class="fecha-destacada"></p>
            <button id="play-music-btn" class="btn-minimalista"><i class="fa-solid fa-pause"></i> Pausar Música</button>
        </div>
    </header>

    <section id="countdown-section" class="section">
        <p id="intro-text" class="intro-text"></p>
        
        <div id="countdown-timer">
            <div class="time-box"><span id="dias">00</span><p>Días</p></div>
            <div class="time-box"><span id="horas">00</span><p>Horas</p></div>
            <div class="time-box"><span id="minutos">00</span><p>Minutos</p></div>
            <div class="time-box"><span id="segundos">00</span><p>Segundos</p></div>
        </div>
    </section>

    <section id="eventos" class="section">
        <div class="card-evento">
            <img src="assets/img-2.png" alt="Dibujo Palacio" class="img-evento">
            <h2 id="event-title"></h2>
            <p id="event-date" class="fecha"></p>
            <p id="event-time" class="hora"></p>
            <p id="event-venue" class="lugar"></p>
            <p id="event-directions-text" class="indicaciones"></p>
            <p id="event-punctuality-text" class="esperamos"></p>
            <a id="maps-link" class="btn-rectangular" target="_blank"></a>
        </div>
    </section>

    <section id="dress-code" class="section bg-lavanda">
        <i class="fa-brands fa-black-tie icon-evento"></i>
        <h2 id="dress-code-title"></h2>
        <p id="dress-code-text" class="frase-dresscode"></p>
        <p id="dress-code-value" class="codigo-vestimenta"></p>
    </section>

    <section id="asistencia" class="section">
        <i class="fa-solid fa-envelope-open-text icon-evento"></i>
        <h2 id="rsvp-title"></h2>
        <p id="rsvp-text"></p>
        <a id="rsvp-link" class="btn-rectangular" target="_blank"></a>
        
        <a id="calendar-link" class="btn-rectangular btn-secundario" target="_blank"></a>
    </section>

    <section id="regalos" class="section bg-lavanda">
        <i class="fa-solid fa-gift icon-evento"></i>
        <h2 id="gifts-title"></h2>
        <p id="gift-text" class="intro-text"></p>
        <div class="datos-bancarios">
            <p><strong>CBU:</strong> <span id="bank-cbu"></span></p>
            <p><strong>Alias:</strong> <span id="bank-alias"></span></p>
            <p><strong>Titular:</strong> <span id="bank-holder"></span></p>
        </div>
    </section>

    <section id="musica-sugerida" class="section">
        <i class="fa-solid fa-music icon-evento"></i>
        <h2 id="music-title"></h2>
        <p id="music-text"></p>
        <a id="spotify-link" class="btn-rectangular" target="_blank"></a>
    </section>

    <footer id="footer" class="section">
        <h2 id="footer-names" class="nombres"></h2>
        <p id="footer-text" class="agradecimiento"></p>
    </footer>

    <script src="script.js"></script>
    <script type="module" src="firebase-config.js"></script>
</body>
</html>
